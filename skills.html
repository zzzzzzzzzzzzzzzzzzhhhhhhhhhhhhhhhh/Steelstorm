<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steelstorm | Skill Tree</title><style>body{margin:0;background:#070b12;color:#eaf2f8;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334252;padding-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}.branch{background:#0c131c;border:1px solid #304154;border-radius:12px;padding:16px}.node{background:#111b26;border:1px solid #405367;border-radius:10px;padding:14px;margin:12px 0}.node.unlocked{border-color:#b7d8ff}.node.locked{opacity:.5}.tactic{border-left:3px solid #91b7d8}.btn{width:100%;padding:10px;background:#172637;border:1px solid #526a80;border-radius:7px;color:#fff;font-weight:800}.btn:disabled{opacity:.4}.rp{font-weight:900;font-size:20px}.tag{display:inline-block;border:1px solid #526a80;border-radius:99px;padding:4px 8px;font-size:11px}.desc{color:#9eacb8;line-height:1.5}.back{color:#a9bac8;text-decoration:none}</style></head><body><div class="wrap"><div class="top"><div><h1>STEELSTORM // COMMAND SKILL TREE</h1><div class="desc">Skills and battle tactics now form separate progression paths.</div></div><div class="rp">RP: <span id="rp">0</span></div></div><div class="grid" id="tree"></div></div><script>const branches={"Military Doctrine":[["Rapid Training",2,"Reduce troop training time."],["Veteran Doctrine",3,"Experienced troops gain a combat bonus."],["Combined Arms",4,"Infantry, armor and aircraft gain a coordination bonus."],["Elite Command",5,"Commanders strengthen nearby units."],["Shock Offensive",6,"Unlock the Shock Offensive battle tactic: a strong opening attack with a short recovery period.","tactic"]],"Defensive Doctrine":[["Fortification",2,"Cities gain stronger defenses."],["Layered Defense",3,"Defensive structures work together."],["Emergency Response",4,"Repair and recovery are faster."],["Iron Bastion",5,"Major bonus to secured-city defense."],["Hold the Line",6,"Battle tactic: temporarily boost defense while reducing movement.","tactic"]],"Logistics Doctrine":[["Supply Routes",2,"Increase supply income."],["Field Logistics",3,"Reduce deployment costs."],["Strategic Reserves",4,"Begin operations with bonus supplies."],["Global Network",5,"Large logistics bonus across your territory."],["Rapid Resupply",6,"Battle tactic: instantly restore part of a force's supplies with a cooldown.","tactic"]],"Recon Doctrine":[["Battlefield Recon",2,"Reveal more battlefield information."],["Sensor Fusion",3,"Improve recon and aircraft accuracy."],["Deep Scan",4,"Reveal hidden enemy positions."],["Total Awareness",5,"Maximum reconnaissance advantage."],["Ghost Recon",6,"Battle tactic: briefly hide a selected force from enemy intelligence.","tactic"]],"Armor Doctrine":[["Reinforced Chassis",2,"Increase vehicle durability."],["Engine Tuning",3,"Increase vehicle speed."],["Adaptive Armor",4,"Reduce incoming vehicle damage."],["Armored Spearhead",5,"Tanks gain a stronger breakthrough bonus."],["Steel Hammer",6,"Battle tactic: concentrate armored units for a temporary breakthrough bonus.","tactic"]],"Air Doctrine":[["Flight Computers",2,"Improve aircraft accuracy."],["Afterburners",3,"Increase aircraft speed."],["Aero Shielding",4,"Increase aircraft durability."],["Air Superiority",5,"Aircraft gain a major combat advantage."],["Sky Lance",6,"Battle tactic: concentrate aircraft on one target for a powerful strike.","tactic"]],"Science Doctrine":[["Advanced Materials",3,"Unlock advanced construction."],["Systems Integration",4,"Improve all research facilities."],["Strategic AI",5,"Reduce selected skill costs."],["Battle Network",6,"Share battlefield bonuses between nearby forces."],["Overclock",7,"Battle tactic: temporarily boost multiple systems at a high resource cost.","tactic"]]};let save={};try{save=JSON.parse(localStorage.getItem('steelstorm-base-v1')||'{}')}catch(e){}save.skills=save.skills||{};save.researchPoints=Number(save.researchPoints||0);function key(n){return n.replace(/[^a-z0-9]/gi,'_')}function render(){document.getElementById('rp').textContent=save.researchPoints;document.getElementById('tree').innerHTML=Object.entries(branches).map(([branch,nodes])=>`<section class="branch"><span class="tag">${branch}</span>${nodes.map((n,i)=>{let prev=i?nodes[i-1][0]:null,done=!!save.skills[n[0]],ready=!prev||!!save.skills[prev];return `<div class="node ${done?'unlocked':ready?'':'locked'} ${n[3]||''}"><h2>${n[0]}</h2><p class="desc">${n[2]}</p><div class="desc">Cost: ${n[1]} RP${prev?' • Requires: '+prev:''}</div><button class="btn" onclick="unlock('${n[0]}',${n[1]},'${prev||''}')" ${done||!ready||save.researchPoints<n[1]?'disabled':''}>${done?'UNLOCKED':n[3]?'UNLOCK TACTIC':'UNLOCK SKILL'}</button></div>`}).join('')}</section>`).join('')}function unlock(n,c,p){if(p&&!save.skills[p]||save.skills[n]||save.researchPoints<c)return;save.researchPoints-=c;save.skills[n]=true;localStorage.setItem('steelstorm-base-v1',JSON.stringify(save));render()}render();</script></body></html>
