<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steelstorm Troop Roster</title><style>body{margin:0;background:#070a0f;color:#eaf1f7;font:16px Arial,sans-serif;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#0e141c;border:1px solid #2c3947;border-radius:10px;padding:16px}.stat{color:#9eacb8;line-height:1.7}h1{letter-spacing:3px}</style></head><body><h1>STEELSTORM TROOP ROSTER</h1><p>Expanded command roster. These units are also being integrated into the main TROOPS screen.</p><div class="grid" id="troops"></div><script>const t=[['Assault Trooper','Fast frontline attacker',120,38,78,170],['Shield Trooper','Heavy defensive infantry',220,28,40,230],['Recon Scout','Rapid battlefield scout',90,24,115,180],['Combat Engineer','Builds and repairs field defenses',125,30,60,210],['Field Medic','Advanced battlefield support',110,12,68,240],['Mortar Team','Indirect fire support',105,82,48,280],['Drone Operator','Controls reconnaissance drones',100,35,105,320],['Heavy Gunner','High-power suppression unit',210,58,42,330],['Elite Ranger','Highly trained special infantry',160,62,100,420],['Urban Assault','Specialist for city battles',175,55,72,390],['Arctic Trooper','Cold-weather specialist',145,48,76,360],['Desert Trooper','Hot-weather specialist',145,48,76,360],['Paratrooper','Rapid-deployment airborne unit',130,52,92,410],['Shock Trooper','Aggressive breakthrough unit',190,70,65,480],['Exo-Soldier','Powered heavy infantry',300,95,50,750],['Plasma Guard','Advanced energy-weapon infantry',240,110,85,900],['Cyber Commando','Elite technology-enhanced soldier',210,100,125,1100],['Titan Guard','Heavy futuristic infantry',420,135,38,1400],['Storm Legionnaire','Top-tier elite infantry',360,150,105,1700]];document.getElementById('troops').innerHTML=t.map(x=>`<div class="card"><h2>${x[0]}</h2><p>${x[1]}</p><div class="stat">HP: ${x[2]}<br>Attack: ${x[3]}<br>Speed: ${x[4]}<br>Cost: $${x[5]}</div></div>`).join('')</script></body></html>
