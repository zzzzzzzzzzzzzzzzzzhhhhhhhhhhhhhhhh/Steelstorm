name: Add expanded troop roster

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-troops:
    if: ${{ !contains(github.event.head_commit.message, 'Add expanded troop roster') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand troop roster
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const troops=[['Rifleman','Balanced soldier',100,25,70,100],['Heavy Infantry','Armoured assault',180,35,45,160],['Sniper','Long-range specialist',80,70,95,220],['Machine Gunner','Suppresses positions',130,40,75,190],['Medic','Restores allies',90,10,55,150],['Engineer','Repairs defenses',110,20,50,140],['Anti-Armor','Vehicle specialist',100,55,65,210],['Commander','Boosts units',150,30,60,300]];"
          new = "const troops=[['Rifleman','Balanced soldier',100,25,70,100],['Heavy Infantry','Armoured assault',180,35,45,160],['Sniper','Long-range specialist',80,70,95,220],['Machine Gunner','Suppresses positions',130,40,75,190],['Medic','Restores allies',90,10,55,150],['Engineer','Repairs defenses',110,20,50,140],['Anti-Armor','Vehicle specialist',100,55,65,210],['Commander','Boosts units',150,30,60,300],['Assault Trooper','Fast frontline attacker',120,38,82,180],['Shield Trooper','Defensive infantry',240,28,42,260],['Recon Scout','Fast reconnaissance unit',95,22,110,190],['Combat Engineer','Builds and supports defenses',140,24,58,230],['Field Medic','Advanced battlefield healer',115,16,68,240],['Mortar Team','Indirect fire support',125,58,48,280],['Drone Operator','Controls scouting drones',105,32,100,320],['Heavy Gunner','High-volume fire support',210,48,38,340],['Elite Ranger','Veteran special forces',155,62,105,420],['Urban Assault','Close-quarters specialist',175,55,78,390],['Arctic Trooper','Cold-weather specialist',160,46,72,360],['Desert Trooper','Extreme-heat specialist',155,44,80,350],['Paratrooper','Rapid deployment infantry',145,42,92,380],['Shock Trooper','Aggressive assault unit',230,68,62,500],['Exo-Soldier','Powered heavy infantry',360,88,48,750],['Plasma Guard','Advanced energy infantry',300,105,72,950],['Mech Pilot','Controls combat walkers',280,115,55,1100],['Cyber Commando','Elite high-tech operative',220,95,125,1250],['Titan Guard','Heavy futuristic infantry',500,135,35,1500],['Storm Legionnaire','Top-tier futuristic soldier',430,145,90,1800]];"
          if old not in s:
              raise SystemExit('Expected troop roster was not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit troop roster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add expanded troop roster"
          git push
