name: Steelstorm Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check game JavaScript
        run: node --check game.js
      - name: Check interactive map JavaScript
        run: node --check map_controls.js
      - name: Verify map script is loaded
        run: grep -q 'map_controls.js' index.html
